<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Mi Soundboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: chasis de sampler; rejilla de pads arriba, barra de pestañas fija abajo. Tema oscuro único, elegido a propósito. */
:root {
  --chassis: #141519;
  --panel: #1e2026;
  --panel-2: #272a31;
  --line: #34373f;
  --ink: #ebe7de;
  --muted: #9a9ca5;
  --danger: #ff5a52;
  --display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--chassis);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; }

header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 4px 14px;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 {
  font-family: var(--display); font-weight: 700; font-size: 1.35rem;
  letter-spacing: .14em; text-transform: uppercase; margin: 0;
}
.brand small { font-family: var(--display); color: var(--muted); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }

.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px;
  padding: 9px 14px; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.stop { border-color: color-mix(in oklab, var(--danger) 55%, var(--line)); color: #ffd0cc; }
.btn.stop .sq { width: 10px; height: 10px; background: var(--danger); border-radius: 2px; }
.btn.primary { background: var(--ink); color: var(--chassis); border-color: var(--ink); }

/* ---------- Tablero ---------- */
.grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 10px; }
.pad {
  --c: #ff4d4d;
  position: relative; aspect-ratio: 1 / 1; max-width: 100%;
  border-radius: 16px; border: 1px solid color-mix(in oklab, var(--c) 45%, var(--line));
  background:
    linear-gradient(180deg, color-mix(in oklab, var(--c) 30%, var(--panel)) 0%, color-mix(in oklab, var(--c) 18%, var(--panel)) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 3px 0 rgba(0,0,0,.45);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 10px; text-align: left; overflow: hidden;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .06s ease, background-color .1s;
}
.pad:active, .pad.hit { transform: translateY(2px) scale(.975); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(0,0,0,.45); }
.pad .tag { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: .7rem; letter-spacing: .12em; color: color-mix(in oklab, var(--c) 60%, var(--ink)); }
.pad .led { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in oklab, var(--c) 35%, #000); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.pad .name {
  font-family: var(--display); font-weight: 600; font-size: clamp(.85rem, 3.6vw, 1.05rem); line-height: 1.15;
  overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.pad .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--c); }
.pad.playing { background: linear-gradient(180deg, color-mix(in oklab, var(--c) 62%, var(--panel)), color-mix(in oklab, var(--c) 42%, var(--panel))); }
.pad.playing .led { background: var(--c); box-shadow: 0 0 10px var(--c), 0 0 2px #fff inset; }
.pad.playing .tag { color: var(--ink); }

.empty {
  border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; text-align: center; color: var(--muted);
  display: grid; gap: 14px; justify-items: center;
}
.empty strong { color: var(--ink); font-family: var(--display); font-size: 1.1rem; letter-spacing: .04em; }

/* ---------- Configurar ---------- */
section h2 { font-family: var(--display); font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; font-weight: 600; }
section h2:first-child { margin-top: 4px; }
.drop {
  display: grid; gap: 6px; justify-items: center; text-align: center;
  border: 1.5px dashed var(--line); border-radius: 16px; padding: 22px 16px; background: var(--panel);
}
.drop.over { border-color: var(--ink); }
.drop p { margin: 0; color: var(--muted); font-size: .9rem; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

.settings { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row > span { font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: .88rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--chassis); }

.list { display: grid; gap: 10px; }
.item { --c: #ff4d4d; display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.item .head { display: flex; gap: 10px; align-items: center; }
.item .play {
  flex: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid color-mix(in oklab, var(--c) 50%, var(--line));
  background: color-mix(in oklab, var(--c) 30%, var(--panel)); display: grid; place-items: center;
}
.item .play svg { width: 16px; height: 16px; fill: var(--ink); }
.item .meta { flex: 1; min-width: 0; display: grid; gap: 2px; }
.item input[type="text"] {
  width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-weight: 600;
}
.item .info { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--display); letter-spacing: .04em; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; background: var(--s); box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.item .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vol { flex: 1 1 140px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; min-width: 0; }
.vol input { flex: 1; min-width: 0; accent-color: var(--c); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:disabled { opacity: .35; }
.del.armed { width: auto; padding: 0 12px; background: var(--danger); border-color: var(--danger); color: #1a0505; font-weight: 700; font-size: .85rem; }
.badge { font-family: var(--display); font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
.note { color: var(--muted); font-size: .85rem; line-height: 1.45; margin: 10px 0 0; max-width: 62ch; }

/* ---------- Barra inferior ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in oklab, var(--chassis) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
nav.tabs .inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
nav.tabs button {
  border: 1px solid transparent; background: transparent; border-radius: 12px; padding: 9px 6px;
  font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: .8rem; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
nav.tabs button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--panel-2); border-color: var(--line); }

.toast {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--chassis); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem;
  max-width: calc(100% - 32px); z-index: 20;
}
@media (max-width: 400px) { .brand small { display: none; } .brand h1 { font-size: 1.15rem; letter-spacing: .1em; } }
@media (prefers-reduced-motion: reduce) { .pad, .btn { transition: none; } }
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Soundboard</h1><small id="count">0 pads</small></div>
    <button class="btn stop" id="stopAll" type="button"><span class="sq"></span>Detener todo</button>
  </header>

  <main id="board" role="tabpanel" aria-label="Tablero">
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyBoard" hidden>
      <strong>Tu tablero está vacío</strong>
      <span>Sube tus audios en Configurar y aparecerán aquí como pads.</span>
      <button class="btn primary" type="button" data-go="config">Ir a Configurar</button>
    </div>
  </main>

  <main id="config" role="tabpanel" aria-label="Configurar" hidden>
    <section>
      <h2>Añadir audios</h2>
      <label class="drop" id="drop" for="file">
        <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.webm" multiple>
        <span class="btn primary">Elegir audios</span>
        <p>MP3, M4A, WAV, OGG… Puedes elegir varios a la vez.</p>
      </label>

      <h2>Tablero</h2>
      <div class="settings">
        <div class="row"><span>Columnas</span>
          <div class="seg" id="colsSeg"><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button></div>
        </div>
        <div class="row"><span>Al tocar un pad que suena</span>
          <div class="seg" id="modeSeg"><button type="button" data-v="restart">Reiniciar</button><button type="button" data-v="stop">Detener</button><button type="button" data-v="overlap">Superponer</button></div>
        </div>
      </div>

      <h2 id="listTitle">Mis sonidos</h2>
      <div class="list" id="list"></div>
      <p class="note">Los audios se guardan solo en este dispositivo y navegador. Si borras los datos del navegador, se pierden.</p>
    </section>
  </main>
</div>

<nav class="tabs" role="tablist">
  <div class="inner">
    <button type="button" role="tab" id="tabBoard" data-go="board" aria-selected="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tablero</button>
    <button type="button" role="tab" id="tabConfig" data-go="config" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Configurar</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const COLORS = ["#ff4d4d", "#ff8a3d", "#ffd23f", "#3ddc84", "#2ec4e6", "#4d7cff", "#a66bff", "#ff5fa2"];
  const BANKS = "ABCDEFGH";
  const $ = (s) => document.querySelector(s);

  const store = {
    get(k, d) { try { const v = localStorage.getItem("sb." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sb." + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- IndexedDB (con respaldo en memoria si no está disponible) ----------
  let dbp = null;
  const mem = new Map();
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("soundboard", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("sounds", { keyPath: "id" });
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch { res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await openDB();
    if (!db) return fn(null);
    return new Promise((res, rej) => {
      const t = db.transaction("sounds", mode);
      const out = fn(t.objectStore("sounds"));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  const DB = {
    async all() {
      const r = await tx("readonly", (s) => s ? s.getAll() : [...mem.values()]);
      return (r || []).sort((a, b) => a.order - b.order);
    },
    put: (rec) => tx("readwrite", (s) => s ? s.put(rec) : mem.set(rec.id, rec)),
    del: (id) => tx("readwrite", (s) => s ? s.delete(id) : mem.delete(id))
  };

  // ---------- Audio (Web Audio para baja latencia y superposición) ----------
  let ctx = null;
  const buffers = new Map();   // id -> AudioBuffer
  const voices = new Map();    // id -> [{src, gain, start, dur}]
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  async function decode(blob) {
    const ab = await blob.arrayBuffer();
    const c = getCtx();
    return await new Promise((res, rej) => c.decodeAudioData(ab, res, rej));
  }
  async function bufferFor(s) {
    if (!buffers.has(s.id)) buffers.set(s.id, await decode(s.blob));
    return buffers.get(s.id);
  }
  function stopVoices(id) {
    (voices.get(id) || []).forEach((v) => { try { v.src.stop(); } catch {} });
    voices.delete(id);
  }
  function stopAll() { [...voices.keys()].forEach(stopVoices); paintPlaying(); }
  async function play(s) {
    const c = getCtx();
    const playing = (voices.get(s.id) || []).length > 0;
    if (playing && state.mode === "stop") { stopVoices(s.id); paintPlaying(); return; }
    if (playing && state.mode === "restart") stopVoices(s.id);
    let buf;
    try { buf = await bufferFor(s); } catch { toast("No se pudo reproducir “" + s.name + "”. El formato quizá no es compatible."); return; }
    const src = c.createBufferSource();
    const gain = c.createGain();
    gain.gain.value = s.vol ?? 1;
    src.buffer = buf;
    src.connect(gain).connect(c.destination);
    const v = { src, start: c.currentTime, dur: buf.duration };
    src.onended = () => {
      const arr = (voices.get(s.id) || []).filter((x) => x !== v);
      arr.length ? voices.set(s.id, arr) : voices.delete(s.id);
      paintPlaying();
    };
    voices.set(s.id, [...(voices.get(s.id) || []), v]);
    src.start();
    paintPlaying();
    loop();
  }
  let raf = 0;
  function loop() {
    if (raf) return;
    const step = () => {
      raf = 0;
      if (!ctx) return;
      document.querySelectorAll(".pad").forEach((el) => {
        const vs = voices.get(el.dataset.id);
        const bar = el.querySelector(".bar");
        if (!vs || !vs.length) { bar.style.width = "0"; return; }
        const v = vs[vs.length - 1];
        bar.style.width = Math.min(100, ((ctx.currentTime - v.start) / v.dur) * 100) + "%";
      });
      if (voices.size) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function paintPlaying() {
    document.querySelectorAll("[data-id]").forEach((el) => el.classList.toggle("playing", voices.has(el.dataset.id)));
  }

  // ---------- Sonidos de ejemplo (sintetizados, se crean la primera vez) ----------
  function wav(fn, secs, sr = 22050) {
    const n = Math.floor(secs * sr), data = new Int16Array(n);
    for (let i = 0; i < n; i++) data[i] = Math.max(-1, Math.min(1, fn(i / sr, secs))) * 32767;
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, n * 2, true);
    new Int16Array(buf, 44).set(data);
    return new Blob([buf], { type: "audio/wav" });
  }
  function examples() {
    const TAU = Math.PI * 2, rnd = () => Math.random() * 2 - 1;
    let ph = 0, last = 0;
    return [
      ["Bombo", "#ff4d4d", 0.6, (t) => { ph += TAU * (45 + 110 * Math.exp(-t * 28)) / 22050; return Math.sin(ph) * Math.exp(-t * 7); }],
      ["Caja", "#ffd23f", 0.3, (t) => (rnd() * 0.7 + Math.sin(TAU * 185 * t) * 0.5) * Math.exp(-t * 16)],
      ["Platillo", "#2ec4e6", 0.25, (t) => { const n = rnd(), o = n - last; last = n; return o * 0.5 * Math.exp(-t * 20); }],
      ["Bocina", "#ff8a3d", 1.2, (t, d) => { const s = (f) => ((t * f) % 1) * 2 - 1; const env = Math.min(1, t * 30) * Math.min(1, (d - t) * 8); return (s(440) + s(554) + s(659)) * 0.22 * env * (0.85 + 0.15 * Math.sin(TAU * 7 * t)); }],
      ["Ding", "#3ddc84", 1.6, (t) => (Math.sin(TAU * 1046 * t) * 0.5 + Math.sin(TAU * 2093 * t) * 0.2 + Math.sin(TAU * 3140 * t) * 0.1) * Math.exp(-t * 3) * Math.min(1, t * 400)],
      ["Láser", "#a66bff", 0.45, (t) => { ph += TAU * (200 + 1600 * Math.exp(-t * 9)) / 22050; return Math.sign(Math.sin(ph)) * 0.25 * Math.exp(-t * 5); }]
    ].map(([name, color, secs, fn], i) => { ph = 0; last = 0; return { name, color, secs, blob: wav(fn, secs), order: i }; });
  }

  // ---------- Estado ----------
  const state = { sounds: [], cols: store.get("cols", 3), mode: store.get("mode", "restart"), tab: "board" };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const fmt = (s) => { if (!s && s !== 0) return "—"; const m = Math.floor(s / 60); return m + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
  const kb = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";

  async function load() {
    state.sounds = await DB.all();
    if (!state.sounds.length && !store.get("seeded", false)) {
      for (const e of examples()) await DB.put({ id: uid(), name: e.name, color: e.color, order: e.order, blob: e.blob, type: "audio/wav", size: e.blob.size, duration: e.secs, vol: 1, example: true });
      store.set("seeded", true);
      state.sounds = await DB.all();
    }
    render();
  }

  // ---------- Render ----------
  function padLabel(i) { return BANKS[Math.floor(i / 16) % 8] + String((i % 16) + 1).padStart(2, "0"); }
  function renderBoard() {
    const grid = $("#grid");
    grid.style.setProperty("--cols", state.cols);
    grid.innerHTML = "";
    state.sounds.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "pad"; b.dataset.id = s.id;
      b.style.setProperty("--c", s.color);
      b.setAttribute("aria-label", "Reproducir " + s.name);
      b.innerHTML = `<span class="tag"><span>${padLabel(i)}</span><span class="led"></span></span><span class="name"></span><span class="bar"></span>`;
      b.querySelector(".name").textContent = s.name;
      b.addEventListener("pointerdown", (e) => { if (e.button === 0) { b.classList.add("hit"); play(s); } });
      const up = () => b.classList.remove("hit");
      b.addEventListener("pointerup", up); b.addEventListener("pointerleave", up); b.addEventListener("pointercancel", up);
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(s); } });
      b.addEventListener("contextmenu", (e) => e.preventDefault());
      grid.appendChild(b);
    });
    $("#emptyBoard").hidden = state.sounds.length > 0;
    $("#count").textContent = state.sounds.length + (state.sounds.length === 1 ? " pad" : " pads");
    paintPlaying();
  }

  const ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
    up: '<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
    del: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
  };
  function renderList() {
    const list = $("#list");
    list.innerHTML = "";
    $("#listTitle").textContent = "Mis sonidos (" + state.sounds.length + ")";
    if (!state.sounds.length) {
      list.innerHTML = '<div class="empty"><span>Aún no hay sonidos. Sube tu primer audio arriba.</span></div>';
      return;
    }
    state.sounds.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "item"; el.style.setProperty("--c", s.color);
      el.innerHTML = `
        <div class="head">
          <button class="play" type="button" data-id="${s.id}" aria-label="Escuchar">${ICON.play}</button>
          <div class="meta">
            <input type="text" id="name-${s.id}" maxlength="40" aria-label="Nombre del sonido">
            <span class="info">${padLabel(i)} · ${fmt(s.duration)} · ${kb(s.size || s.blob.size)}${s.example ? '<span class="badge">Ejemplo</span>' : ""}</span>
          </div>
        </div>
        <div class="swatches" role="group" aria-label="Color del pad">
          ${COLORS.map((c) => `<button type="button" class="sw" style="--s:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c === s.color}"></button>`).join("")}
        </div>
        <div class="foot">
          <label class="vol">Vol <input type="range" id="vol-${s.id}" min="0" max="1.5" step="0.05" value="${s.vol ?? 1}"></label>
          <button class="icon-btn" type="button" data-act="up" aria-label="Subir" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
          <button class="icon-btn" type="button" data-act="down" aria-label="Bajar" ${i === state.sounds.length - 1 ? "disabled" : ""}>${ICON.down}</button>
          <button class="icon-btn del" type="button" data-act="del" aria-label="Borrar">${ICON.del}</button>
        </div>`;
      const name = el.querySelector("input[type=text]");
      name.value = s.name;
      name.addEventListener("change", async () => { s.name = name.value.trim() || "Sin nombre"; name.value = s.name; await DB.put(s); renderBoard(); });
      el.querySelector(".play").addEventListener("click", () => play(s));
      el.querySelectorAll(".sw").forEach((sw) => sw.addEventListener("click", async () => {
        s.color = sw.dataset.c; el.style.setProperty("--c", s.color);
        el.querySelectorAll(".sw").forEach((x) => x.setAttribute("aria-pressed", x === sw));
        await DB.put(s); renderBoard();
      }));
      el.querySelector("input[type=range]").addEventListener("change", async (e) => { s.vol = +e.target.value; await DB.put(s); });
      el.querySelector("[data-act=up]").addEventListener("click", () => move(i, -1));
      el.querySelector("[data-act=down]").addEventListener("click", () => move(i, 1));
      const del = el.querySelector("[data-act=del]");
      let timer = 0;
      del.addEventListener("click", async () => {
        if (!del.classList.contains("armed")) {
          del.classList.add("armed"); del.textContent = "¿Borrar?";
          timer = setTimeout(() => { del.classList.remove("armed"); del.innerHTML = ICON.del; }, 3000);
          return;
        }
        clearTimeout(timer);
        stopVoices(s.id); buffers.delete(s.id);
        await DB.del(s.id);
        state.sounds.splice(state.sounds.indexOf(s), 1);
        await renumber(); render(); toast("“" + s.name + "” borrado");
      });
      list.appendChild(el);
    });
    paintPlaying();
  }
  async function renumber() { for (let i = 0; i < state.sounds.length; i++) { if (state.sounds[i].order !== i) { state.sounds[i].order = i; await DB.put(state.sounds[i]); } } }
  async function move(i, d) {
    const j = i + d; if (j < 0 || j >= state.sounds.length) return;
    [state.sounds[i], state.sounds[j]] = [state.sounds[j], state.sounds[i]];
    await renumber(); render();
  }
  function renderSettings() {
    document.querySelectorAll("#colsSeg button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.v === state.cols));
    document.querySelectorAll("#modeSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.mode));
  }
  function render() { renderBoard(); renderList(); renderSettings(); }

  // ---------- Subida de archivos ----------
  async function addFiles(files) {
    const list = [...files].filter((f) => f.type.startsWith("audio/") || /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|webm|amr|3gp)$/i.test(f.name));
    if (!list.length) { toast("Esos archivos no parecen audios."); return; }
    let ok = 0, bad = 0;
    for (const f of list) {
      let duration = null, buf = null;
      try { buf = await decode(f); duration = buf.duration; } catch { bad++; continue; }
      const rec = {
        id: uid(), name: f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim().slice(0, 40) || "Sonido",
        color: COLORS[state.sounds.length % COLORS.length], order: state.sounds.length,
        blob: f, type: f.type, size: f.size, duration, vol: 1
      };
      try { await DB.put(rec); } catch { toast("No hay espacio para guardar “" + rec.name + "”."); continue; }
      buffers.set(rec.id, buf);
      state.sounds.push(rec); ok++;
    }
    render();
    toast((ok ? ok + (ok === 1 ? " audio añadido" : " audios añadidos") : "No se añadió ningún audio") + (bad ? " · " + bad + " con formato no compatible" : ""));
  }
  $("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

  // ---------- Navegación y ajustes ----------
  function go(tab) {
    state.tab = tab;
    $("#board").hidden = tab !== "board";
    $("#config").hidden = tab !== "config";
    $("#tabBoard").setAttribute("aria-selected", tab === "board");
    $("#tabConfig").setAttribute("aria-selected", tab === "config");
    store.set("tab", tab);
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", (e) => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); });
  $("#colsSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.cols = +b.dataset.v; store.set("cols", state.cols); renderSettings(); renderBoard(); });
  $("#modeSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.mode = b.dataset.v; store.set("mode", state.mode); renderSettings(); });
  $("#stopAll").addEventListener("click", stopAll);

  let tt = 0;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2600); }

  go(store.get("tab", "board"));
  load();
})();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
